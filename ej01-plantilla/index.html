<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio 1 · Plantilla Bootstrap</title>

  <!-- ============================================================
       EJERCICIO 1 · Plantilla inicial
       ============================================================ -->

  <!-- PASO 2a: meta viewport → hace que la web se adapte al ancho del móvil -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- PASO 2b: CSS de Bootstrap 5.3.8 por CDN (cargamos la hoja de estilos de Bootstrap) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>
<body>

  <div class="container py-5">
    <h1>¡Hola Bootstrap!</h1>
    <p>Esta es mi primera página con Bootstrap 5. Si ves esto con estilo, ¡funciona!</p>
    <button class="btn btn-primary">Mi primer botón</button>
  </div>

</body>
</html>
